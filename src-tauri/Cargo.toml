[package]
name = "personal-clipper-studio"
version = "0.1.0"
description = "Personal Clipper Studio desktop application"
authors = ["Personal Clipper Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
uuid = { version = "1.29", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
