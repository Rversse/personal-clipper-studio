[project]
name = "personal-clipper-service"
version = "0.2.0"
description = "Local API and media-processing service for Personal Clipper Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"
