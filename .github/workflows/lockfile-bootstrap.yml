name: Bootstrap npm lockfile (temporary)

on:
  push:
    branches:
      - security/stage-1-hardening

permissions:
  contents: write

concurrency:
  group: npm-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/security/stage-1-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to the hardening branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm dependency lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
