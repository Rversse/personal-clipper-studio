name: Windows desktop build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installers:
    name: Build and smoke-test Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend and CPU transcription dependencies from the committed lockfile
        run: |
          python -m pip install "uv==0.13.6"
          uv sync --system --project backend --extra transcription --extra build --locked
      - name: Build self-contained local API directory
        run: >
          pyinstaller --clean --noconfirm --onedir
          --name pcs-api
          --distpath build/windows-backend
          --workpath build/windows-pyinstaller
          --specpath build
          --paths backend
          --collect-submodules app
          --collect-all fastapi
          --collect-all uvicorn
          --collect-all pydantic_settings
          --collect-all multipart
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tokenizers
          --collect-all av
          --collect-all keyring
          --collect-all win32ctypes
          --hidden-import keyring.backends.Windows
          backend/desktop_runner.py
      - name: Stage packaged API resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = "build/windows-backend/pcs-api"
          $resourceDir = "src-tauri/resources/pcs-api"
          $backendExe = Join-Path $sourceDir "pcs-api.exe"
          if (-not (Test-Path $backendExe)) {
            throw "PyInstaller output is missing: $backendExe"
          }
          if (Test-Path $resourceDir) {
            Remove-Item $resourceDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
          Copy-Item (Join-Path $sourceDir "*") $resourceDir -Recurse -Force
      - name: Smoke-test packaged backend executable
        run: python scripts/smoke_test_packaged_backend.py src-tauri/resources/pcs-api/pcs-api.exe
      - name: Build unsigned NSIS and MSI installers
        run: npm run tauri -- build --bundles nsis,msi
      - name: Stage installers and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = "build/windows-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $nsisFiles = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          $msiFiles = @(Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File)
          if ($nsisFiles.Count -eq 0 -or $msiFiles.Count -eq 0) {
            throw "Expected both NSIS and MSI installers, but one or both outputs are missing."
          }
          Copy-Item $nsisFiles.FullName $artifactDir
          Copy-Item $msiFiles.FullName $artifactDir
          Copy-Item "docs/WINDOWS_INSTALLATION.md" $artifactDir
          $checksums = Get-ChildItem $artifactDir -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") } |
            Get-FileHash -Algorithm SHA256
          $checksums | ForEach-Object {
            "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content (Join-Path $artifactDir "SHA256SUMS.txt")
      - name: Install, launch, and uninstall both Windows packages
        shell: pwsh
        run: ./scripts/smoke_test_windows_installers.ps1 -ArtifactDirectory "build/windows-artifacts"
      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-clipper-studio-windows
          path: build/windows-artifacts/*
          if-no-files-found: error
          retention-days: 7
