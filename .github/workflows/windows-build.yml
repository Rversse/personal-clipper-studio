name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installers:
    name: Build and smoke-test Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.1"
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend and CPU transcription dependencies from the committed lockfile
        run: |
          python -m pip install "uv==0.13.6"
          uv sync --project backend --extra transcription --extra build --locked
      - name: Build self-contained local API directory
        run: >
          uv run --project backend --extra transcription --extra build --no-sync pyinstaller --clean --noconfirm --onedir
          --name pcs-api
          --distpath build/windows-backend
          --workpath build/windows-pyinstaller
          --specpath build
          --paths backend
          --collect-submodules app
          --collect-all fastapi
          --collect-all uvicorn
          --collect-all pydantic_settings
          --collect-all multipart
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tokenizers
          --collect-all av
          --collect-all keyring
          --collect-all win32ctypes
          --hidden-import keyring.backends.Windows
          backend/desktop_runner.py
      - name: Stage packaged API resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = "build/windows-backend/pcs-api"
          $resourceDir = "src-tauri/resources/pcs-api"
          $backendExe = Join-Path $sourceDir "pcs-api.exe"
          if (-not (Test-Path $backendExe)) {
            throw "PyInstaller output is missing: $backendExe"
          }
          if (Test-Path $resourceDir) {
            Remove-Item $resourceDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
          Copy-Item (Join-Path $sourceDir "*") $resourceDir -Recurse -Force
      - name: Download and bundle FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $bin = Get-ChildItem $extract -Directory | ForEach-Object { Join-Path $_.FullName "bin" } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bin) { throw "FFmpeg archive does not contain a bin directory." }
          $target = "src-tauri/resources/pcs-api/ffmpeg"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $source = Join-Path $bin $name
            if (-not (Test-Path $source)) { throw "Missing required media executable: $source" }
            Copy-Item $source $target
          }
          if (-not (Test-Path (Join-Path $target "ffmpeg.exe")) -or -not (Test-Path (Join-Path $target "ffprobe.exe"))) {
            throw "Bundled FFmpeg/FFprobe verification failed."
          }
      - name: Smoke-test packaged backend executable
        run: python scripts/smoke_test_packaged_backend.py src-tauri/resources/pcs-api/pcs-api.exe
      - name: Verify bundled media tools
        shell: pwsh
        run: |
          $tools = "src-tauri/resources/pcs-api/ffmpeg"
          & (Join-Path $tools "ffmpeg.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed its version check." }
          & (Join-Path $tools "ffprobe.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFprobe failed its version check." }
      - name: Build single unsigned NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Stage installers and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = "build/windows-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $nsisFiles = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($nsisFiles.Count -ne 1) {
            throw "Expected exactly one NSIS setup.exe, found $($nsisFiles.Count)."
          }
          Copy-Item $nsisFiles.FullName $artifactDir
          Copy-Item "docs/WINDOWS_INSTALLATION.md" $artifactDir
          $checksums = Get-ChildItem $artifactDir -File |
            Where-Object { $_.Extension -eq ".exe" } |
            Get-FileHash -Algorithm SHA256
          $checksums | ForEach-Object {
            "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content (Join-Path $artifactDir "SHA256SUMS.txt")
      - name: Install, launch, and uninstall both Windows packages
        shell: pwsh
        run: ./scripts/smoke_test_windows_installers.ps1 -ArtifactDirectory "build/windows-artifacts"
      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-clipper-studio-windows
          path: build/windows-artifacts/*
          if-no-files-found: warn
          retention-days: 7
