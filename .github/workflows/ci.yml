name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: npm install
      - run: npm run build

  backend:
    name: Backend import and health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg for audio analysis smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - name: Audit installed Python dependencies for known vulnerabilities
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit --local
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - name: Verify API imports
        run: python -c "from app.main import app; print(app.title)"
        working-directory: backend
