name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: npm install
      - name: Audit frontend dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Commit generated npm lockfile to the hardening branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/stage-1-hardening'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "build: add reproducible npm dependency lockfile"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  backend:
    name: Backend import and health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install FFmpeg for audio analysis smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - name: Upgrade vulnerable Python build tooling
        run: python -m pip install --upgrade "setuptools>=84.1.0"
      - name: Audit installed Python dependencies for known vulnerabilities
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit --local
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - name: Verify API imports
        run: python -c "from app.main import app; print(app.title)"
        working-directory: backend
